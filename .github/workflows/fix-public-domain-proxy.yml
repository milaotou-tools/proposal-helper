name: Fix Public Proposal Domain Proxy

on:
  workflow_dispatch:

jobs:
  fix-domain-proxy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ALIYUN_SSH_KEY }}

      - name: Trust server host key
        env:
          ALIYUN_PORT: ${{ secrets.ALIYUN_PORT }}
        run: |
          SSH_PORT="${ALIYUN_PORT:-22}"
          mkdir -p ~/.ssh
          ssh-keyscan -p "$SSH_PORT" -H "${{ secrets.ALIYUN_HOST }}" >> ~/.ssh/known_hosts

      - name: Route proposal.we-teach.cn to the healthy application
        env:
          ALIYUN_PORT: ${{ secrets.ALIYUN_PORT }}
        run: |
          SSH_PORT="${ALIYUN_PORT:-22}"
          ssh -p "$SSH_PORT" "${{ secrets.ALIYUN_USER }}@${{ secrets.ALIYUN_HOST }}" 'bash -s' << 'SSHSCRIPT'
          set -euo pipefail

          PROXY_DIR="/www/server/panel/vhost/nginx/proxy/proposal.we-teach.cn"
          SITE_CONF=$(grep -rlE 'proxy_pass[[:space:]]+http://127\.0\.0\.1:(3005|8085)[[:space:]]*;' "$PROXY_DIR" 2>/dev/null | head -1)
          if [ -z "$SITE_CONF" ]; then
            echo "ERROR: Cannot find the active proxy config for proposal.we-teach.cn"
            exit 1
          fi

          echo "=== Config file: $SITE_CONF ==="
          sed -i -E 's#proxy_pass[[:space:]]+http://127\.0\.0\.1:(3005|8085)[[:space:]]*;#proxy_pass http://127.0.0.1:3005;#' "$SITE_CONF"

          if grep -q "proxy_read_timeout" "$SITE_CONF"; then
            sed -i -E 's/(proxy_connect_timeout[[:space:]]+)[^;]+;/\1180s;/g' "$SITE_CONF"
            sed -i -E 's/(proxy_read_timeout[[:space:]]+)[^;]+;/\1180s;/g' "$SITE_CONF"
            sed -i -E 's/(proxy_send_timeout[[:space:]]+)[^;]+;/\1180s;/g' "$SITE_CONF"
          else
            sed -i '/proxy_pass[[:space:]]\+http:\/\/127\.0\.0\.1:3005[[:space:]]*;/a\    proxy_connect_timeout 180s;\n    proxy_read_timeout 180s;\n    proxy_send_timeout 180s;' "$SITE_CONF"
          fi

          echo "=== Active proxy settings ==="
          grep -nE 'proxy_pass|proxy_(connect|read|send)_timeout' "$SITE_CONF"
          grep -q 'proxy_pass http://127.0.0.1:3005;' "$SITE_CONF"
          grep -q 'proxy_connect_timeout 180s;' "$SITE_CONF"
          grep -q 'proxy_read_timeout 180s;' "$SITE_CONF"
          grep -q 'proxy_send_timeout 180s;' "$SITE_CONF"

          nginx -t
          nginx -s reload
          curl -fsS --max-time 15 https://proposal.we-teach.cn/api/health
          SSHSCRIPT
